repos:
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint

  # Security Analysis
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-r", "api/", "--exclude", "tests/", "-ll"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy-strict
        name: Type check with mypy (strict mode)
        entry: mypy
        args: [api/, --strict]
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: pip-audit
        name: Dependency vulnerability scan
        entry: pip-audit
        args: ["--strict", "--progress-spinner", "off", "-r", "requirements.txt"]
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: run-unit-tests
        name: Run unit tests
        entry: python
        args: [run_tests.py, --unit, --no-deps-check]
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: run-integration-tests
        name: Run integration tests
        entry: python
        args: [run_tests.py, --integration, --no-deps-check]
        language: system
        stages: [pre-push]
        pass_filenames: false
