# GitLab CI/CD Pipeline for n8n-deploy
# Python CLI tool for n8n workflow management

stages:
  - security
  - quality
  - test
  - build-matrix
  - build

# Docker services for caching (only used by Docker-specific jobs)
# services:
#   - docker:20.10.16-dind

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.9"
  # Docker caching configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1
  # APT proxy for faster package installation
  APT_PROXY: "192.168.76.5:3142"

# Cache for pip dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip/
    - .venv/

# Docker image caching template (disabled - not needed for Python-only pipeline)
# .docker_cache: &docker_cache
#   before_script:
#     - docker info
#     - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY || true
#     - docker pull $CI_REGISTRY_IMAGE:cache || true

# Template for Python environment setup
.python_setup: &python_setup
  before_script:
    # Configure APT proxy for faster package installation
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy || true
    - apt-get -q update && apt-get install -q -y git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet uv
    - uv venv --python python3 .venv
    - source .venv/bin/activate
    - uv pip install --quiet -e ".[test,dev]"

# Quality stage - Type checking
quality:mypy:
  stage: quality
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  script:
    - source .venv/bin/activate
    - rm -rf .mypy_cache/  # Clear cache to ensure type stubs are recognized
    - mypy api/ --strict --show-error-codes
    - echo "✅ Type checking passed"

# Quality stage - Code formatting
quality:black:
  stage: quality
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  script:
    - source .venv/bin/activate
    - black --check api/
    - echo "✅ Code formatting check passed"

# Quality stage - Comprehensive test report
quality:coverage:
  stage: quality
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  script:
    - source .venv/bin/activate
    - export N8N_DEPLOY_TESTING=1
    - python run_tests.py --report --no-deps-check --quiet
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: test-results.xml
    paths:
      - htmlcov/
      - test-results.xml
    expire_in: 30 days
  coverage: '/TOTAL.*\s+(\d+%)$/'

# Test stage - Unit tests
test:unit:
  stage: test
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  script:
    - source .venv/bin/activate
    - python run_tests.py --unit --no-deps-check --quiet
    - echo "✅ Unit tests passed"
  coverage: '/TOTAL.*\s+(\d+%)$/'

# Test stage - Integration tests
test:integration:
  stage: test
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  script:
    - source .venv/bin/activate
    - export N8N_DEPLOY_TESTING=1
    - python run_tests.py --integration --no-deps-check --quiet
    - echo "✅ Integration tests passed"

# Build Matrix stage - Multi-version package builds
build:python-matrix:
  stage: build-matrix
  image: python:${PYTHON_VERSION}-slim
  tags:
    - python
  dependencies:
    - build:validation
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11"]
  before_script:
    # Configure APT proxy for faster package installation
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy || true
    - apt-get -q update && apt-get -q install -y git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet uv
  script:
    - uv venv --python python3 .venv
    - source .venv/bin/activate
    - uv pip install --quiet -e ".[test,dev]"
    - uv pip install --quiet build
    - echo "🔧 Building package for Python ${PYTHON_VERSION}..."
    - python -m build --wheel --sdist
    - pip install dist/*.whl
    - n8n-deploy --version
    - echo "✅ Build successful for Python ${PYTHON_VERSION}"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  allow_failure: false

# Build Matrix stage - Validation build (runs on all branches)
build:validation:
  stage: build-matrix
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  dependencies:
    - quality:coverage
    - test:unit
    - test:integration
  script:
    - source .venv/bin/activate
    - echo "🔧 Running final validation build..."
    - uv pip install build
    - python -m build --wheel
    - pip install dist/*.whl
    - n8n-deploy --version
    - echo "✅ Package build and installation validation completed"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour


# Build stage - Production environment setup
build:production:
  stage: build
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  dependencies:
    - build:validation
    - build:python-matrix
  script:
    - source .venv/bin/activate
    - echo "🚀 Production environment build completed successfully"
    - echo "All pipeline stages have passed validation for production release"
  artifacts:
    paths:
      - .venv/
    expire_in: 1 hour

# Security scanning
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Override SAST for Python
sast:
  stage: security
  tags:
    - python
  variables:
    SAST_EXCLUDED_PATHS: "tests/, .venv/"
  after_script:
    # Ensure SAST report exists to prevent artifact warnings
    - test -f gl-sast-report.json || echo '{"version":"2.0","vulnerabilities":[]}' > gl-sast-report.json

# Secret detection
secret_detection:
  stage: security
  tags:
    - python
  variables:
    SECRET_DETECTION_EXCLUDED_PATHS: "tests/"
  after_script:
    # Ensure secret detection report exists to prevent artifact warnings
    - test -f gl-secret-detection-report.json || echo '{"version":"2.0","secrets":[]}' > gl-secret-detection-report.json

# Dependency scanning
dependency_scanning:
  stage: security
  tags:
    - python
  after_script:
    # Ensure dependency scanning report exists to prevent artifact warnings
    - test -f gl-dependency-scanning-report.json || echo '{"version":"2.0","dependency_files":[],"vulnerabilities":[]}' > gl-dependency-scanning-report.json
