# GitLab CI/CD Pipeline for n8n-deploy
# Python CLI tool for n8n workflow management
# Mirrors GitHub Actions workflow structure with branch-based deployment strategy

stages:
  - security
  - quality
  - test
  - build-matrix
  - build
  - deploy

# Docker services for caching (only used by Docker-specific jobs)
# Uncomment and configure for jobs that need Docker-in-Docker:
# services:
#   - name: docker:20.10.16-dind
#     command: [
#       "--mtu=1300",  # Fix TLS handshake timeout issues
#       "--registry-mirror", "http://registry-mirror.pirouter.dev:5000"  # Use local mirror (when available)
#     ]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.9"
  # Docker caching configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1
  # Docker Registry Configuration:
  # - pull_policy: if-not-present (configured in GitLab Runner config.toml)
  # - registry_mirror: http://registry-mirror.pirouter.dev:5000 (configured in GitLab Runner config.toml)
  # - MTU: 1300 for DinD (see services comment above)
  # APT proxy for faster package installation
  APT_PROXY: "192.168.76.5:3142"
  # PyPI deployment configuration (set in CI/CD variables)
  # PYPI_TOKEN: <set in GitLab CI/CD settings>
  # TEST_PYPI_TOKEN: <set in GitLab CI/CD settings>

# Workflow rules - define when pipeline runs
workflow:
  rules:
    # Run on pushes to master, develop, feat/* branches
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feat\/.*/'
      when: always
    # Run on all tags
    - if: '$CI_COMMIT_TAG'
      when: always
    # Run on merge requests targeting master, main, or develop
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop")'
      when: always
    # Manual workflow dispatch
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    # Skip for all other cases
    - when: never

# Cache for pip dependencies
cache:
  key:
    files:
      - requirements.txt
    prefix: ${CI_COMMIT_REF_SLUG}
  fallback_keys:
    - develop
    - master
  paths:
    - .cache/pip/
    - .venv/
    - .mypy_cache/

# Template for Python environment setup
.python_setup: &python_setup
  before_script:
    # Configure APT proxy for faster package installation
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
    - apt-get -q update && apt-get -qy install git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet uv
    - uv venv --python python3 .venv
    - source .venv/bin/activate
    - uv pip install --quiet -e ".[test,dev]"

# ============================================
# SECURITY STAGE
# ============================================

# SAST security scanning
sast:
  stage: security
  image: python:3.9-slim
  tags:
    - python
  variables:
    SAST_EXCLUDED_PATHS: "tests/, .venv/"
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy || true
    - apt-get -q update && apt-get -qy install git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet safety bandit semgrep
    - pip install -e .
  script:
    - echo "🔍 Running security audit of dependencies..."
    - safety check --json || true
    - echo "🔍 Running static security analysis with Bandit..."
    - bandit -r api/ -f json --exclude tests/ || true
    - echo "🔍 Running static security analysis with Semgrep..."
    - python -m semgrep --config=auto api/ --json || true
    - echo "✅ Security analysis completed"
  allow_failure: true

# Secret detection
secret_detection:
  stage: security
  image: python:3.9-slim
  tags:
    - python
  cache:
    policy: pull
  variables:
    SECRET_DETECTION_EXCLUDED_PATHS: "tests/"
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
    - apt-get -q update && apt-get -qy install git wget
    - wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz | tar xz -C /usr/local/bin
  script:
    - echo "🔍 Running secret detection with gitleaks..."
    - gitleaks git . --verbose --redact --config .gitleaks.toml
    - echo "✅ Secret detection completed"

# Dependency vulnerability scanning
dependency_scanning:
  stage: security
  image: python:3.9-slim
  tags:
    - python
  cache:
    policy: pull
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
    - apt-get -q update && apt-get -qy install git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet pip-audit
  script:
    - echo "🔍 Running dependency vulnerability scanning..."
    - pip-audit -r requirements.txt
    - echo "✅ Dependency scanning completed"

# Python security scanning with Bandit
security:bandit:
  stage: security
  image: python:3.9-slim
  tags:
    - python
  cache:
    policy: pull
  variables:
    SAST_EXCLUDED_PATHS: "tests/, .venv/"
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
    - apt-get -q update && apt-get -qy install git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet bandit
    - pip install -e .
  script:
    - echo "🔍 Running Python security analysis with Bandit..."
    - bandit -r api/ -f json --exclude tests/
    - echo "✅ Bandit analysis completed"

# Pattern-based security scanning with Semgrep
security:semgrep:
  stage: security
  image: python:3.9-slim
  tags:
    - python
  cache:
    policy: pull
  variables:
    SAST_EXCLUDED_PATHS: "tests/, .venv/"
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
    - apt-get -q update && apt-get -qy install git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet semgrep
    - pip install -e .
  script:
    - echo "🔍 Running pattern-based security analysis with Semgrep..."
    - semgrep --config=auto api/ --json --error
    - echo "✅ Semgrep analysis completed"

# ============================================
# QUALITY STAGE
# ============================================

# Type checking with mypy
quality:mypy:
  stage: quality
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  needs:
    - security:bandit
    - security:semgrep
    - secret_detection
    - dependency_scanning
  script:
    - source .venv/bin/activate
    - uv pip install --quiet types-requests types-click
    - mypy api/ --strict --show-error-codes
    - echo "✅ Type checking passed"

# Code formatting check with black
quality:black:
  stage: quality
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  needs:
    - security:bandit
    - security:semgrep
    - secret_detection
    - dependency_scanning
  script:
    - source .venv/bin/activate
    - black --check api/
    - echo "✅ Code formatting check passed"

# ============================================
# TEST STAGE
# ============================================

# Unit tests
test:unit:
  stage: test
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  needs:
    - quality:mypy
    - quality:black
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - source .venv/bin/activate
    - export N8N_DEPLOY_TESTING=1
    #- python -m pytest tests/unit/ --cov=api --cov-report= -v
    - python run_tests.py --unit --no-deps-check --quiet
    - echo "✅ Unit tests passed"
  artifacts:
    paths:
      - .coverage
    expire_in: 1 hour

# Integration tests
test:integration:
  stage: test
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  needs:
    - quality:mypy
    - quality:black
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - source .venv/bin/activate
    - export N8N_DEPLOY_TESTING=1
    - python run_tests.py --integration --no-deps-check --quiet
    - echo "✅ Integration tests passed"
  artifacts:
    paths:
      - .coverage
    expire_in: 1 hour

# Property-based tests with Hypothesis
test:hypothesis:
  stage: test
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  needs:
    - quality:mypy
    - quality:black
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - source .venv/bin/activate
    - export N8N_DEPLOY_TESTING=1
    - echo "Running property-based tests with Hypothesis..."
    - python run_tests.py --hypothesis --no-deps-check
    - echo "✅ Property-based tests passed (755 generated examples)"
  artifacts:
    when: always
    paths:
      - .hypothesis/
    expire_in: 7 days

# Comprehensive test coverage report (generates reports from test job artifacts)
coverage:report:
  stage: test
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  cache:
    policy: pull
  needs:
    - test:unit
    - test:integration
    - test:hypothesis
  dependencies:
    - test:unit
    - test:integration
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - echo "📊 Generating coverage report..."
    - python run_tests.py --report-e2e --no-deps-check --quiet
    - echo "✅ Coverage report generated"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 30 days
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ============================================
# BUILD-MATRIX STAGE
# ============================================

# Multi-version package builds (Python 3.9-3.13)
build:python-matrix:
  stage: build-matrix
  image: python:${PYTHON_VERSION}-slim
  tags:
    - python
  cache:
    key:
      files:
        - requirements.txt
      prefix: py${PYTHON_VERSION}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip/
      - .venv/
  needs:
    - test:unit
    - test:integration
    - test:hypothesis
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
    - apt-get -q update && apt-get -qy install git
    - python -m pip install --quiet --upgrade pip
    - pip install --quiet uv
  script:
    - uv venv --python python3 .venv
    - source .venv/bin/activate
    - uv pip install --quiet -e ".[test,dev]"
    - uv pip install --quiet build
    - echo "🔧 Building package for Python ${PYTHON_VERSION}..."
    - python -m build --wheel --sdist
    - pip install dist/*.whl
    - n8n-deploy --version
    - echo "✅ Build successful for Python ${PYTHON_VERSION}"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# ============================================
# BUILD STAGE
# ============================================

# Production build (runs on master, main, or tags)
build:production:
  stage: build
  image: python:3.9-slim
  tags:
    - python
  <<: *python_setup
  needs:
    - build:python-matrix
  dependencies:
    - build:python-matrix
  rules:
    # Run on master/main branch pushes
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      when: on_success
    # Run on all tags
    - if: '$CI_COMMIT_TAG'
      when: on_success
    # Run on MRs targeting master/main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
      when: on_success
    # Skip for all other cases
    - when: never
  script:
    - source .venv/bin/activate
    - uv pip install --quiet build twine
    - python -m build --wheel --sdist
    - twine check dist/*
    - echo "🚀 Production environment build completed successfully"
    - echo "All pipeline stages have passed validation for production release"
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

