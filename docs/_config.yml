# Site settings
title: "n8n-deploy Documentation"
description: "Python CLI tool for managing n8n workflows with SQLite metadata"
url: "https://lehcode.github.io"
baseurl: "/n8n-deploy"
author:
  name: "n8n-deploy Contributors"
  url: "https://github.com/lehcode/n8n-deploy/graphs/contributors"
lang: "en-US"

# SEO
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Social
twitter:
  username: lehcode
  card: summary
github_username: lehcode

# Theme
theme: just-the-docs
color_scheme: light

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_sensitive
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/lehcode/n8n-deploy
    hide_icon: false

# Aux links (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/lehcode/n8n-deploy"

# Footer
footer_content: "Copyright &copy; 2025 n8n-deploy Contributors. Distributed under the MIT License."

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Callouts (info boxes)
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Mermaid diagrams support
mermaid:
  version: "10.6.1"

# Sass configuration - suppress deprecation warnings from theme dependencies
sass:
  quiet_deps: true
  silence_deprecations: ["import"]
