# GitHub Actions CI/CD Pipeline for n8n-deploy
# Python CLI tool for n8n workflow management
# Mirrors GitLab CI/CD pipeline structure exactly

name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, feat/*, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"

jobs:
  # Security stage
  sast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep

    - name: Install project dependencies
      run: |
        pip install -e .

    - name: Security audit of dependencies
      run: safety check --json || true

    - name: Static security analysis with Bandit
      run: bandit -r api/ -f json --exclude tests/ || true

    - name: Static security analysis with Semgrep
      run: |
        python -m semgrep --config=auto api/ --json || true

  secret-detection:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run secret detection with TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
      continue-on-error: true

  dependency-scanning:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install safety
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Dependency vulnerability scanning
      run: safety check --json || true

  # Quality stage
  quality-mypy:
    runs-on: ubuntu-latest
    needs: [sast, secret-detection, dependency-scanning]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.9-

    - name: Install dependencies
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        uv pip install types-requests types-click

    - name: Run type checking
      run: |
        source .venv/bin/activate
        rm -rf .mypy_cache/
        mypy api/ --strict --show-error-codes
        echo "✅ Type checking passed"

  quality-black:
    runs-on: ubuntu-latest
    needs: [sast, secret-detection, dependency-scanning]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.9-

    - name: Install dependencies
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"

    - name: Check code formatting
      run: |
        source .venv/bin/activate
        black --check api/
        echo "✅ Code formatting check passed"

  quality-coverage:
    runs-on: ubuntu-latest
    needs: [sast, secret-detection, dependency-scanning]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.9-

    - name: Install dependencies
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"

    - name: Generate coverage report
      run: |
        source .venv/bin/activate
        export N8N_DEPLOY_TESTING=1
        python run_tests.py --report --no-deps-check --quiet

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          htmlcov/
          coverage.xml
          test-results.xml
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # Test stage
  test-unit:
    runs-on: ubuntu-latest
    needs: [quality-mypy, quality-black, quality-coverage]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.9-

    - name: Install dependencies and run unit tests
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        python run_tests.py --unit --no-deps-check --quiet
        echo "✅ Unit tests passed"

  test-integration:
    runs-on: ubuntu-latest
    needs: [quality-mypy, quality-black, quality-coverage, test-unit]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.9-

    - name: Install dependencies and run integration tests
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        export N8N_DEPLOY_TESTING=1
        python run_tests.py --integration --no-deps-check --quiet
        echo "✅ Integration tests passed"

  test-hypothesis:
    runs-on: ubuntu-latest
    needs: [quality-mypy, quality-black, quality-coverage, test-unit, test-integration]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
          .hypothesis
        key: ${{ runner.os }}-uv-hypothesis-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-hypothesis-3.9-

    - name: Install dependencies and run property-based tests
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        export N8N_DEPLOY_TESTING=1
        echo "Running property-based tests with Hypothesis..."
        pytest tests/generators/hypothesis_generator.py -v --tb=short --hypothesis-show-statistics
        echo "✅ Property-based tests passed (755 generated examples)"

    - name: Upload hypothesis database
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hypothesis-database
        path: .hypothesis/
        retention-days: 7

  # Build-matrix stage
  build-validation:
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-hypothesis]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.9-

    - name: Install dependencies and run validation build
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        echo "🔧 Running final validation build..."
        uv pip install build
        python -m build --wheel
        pip install dist/*.whl
        n8n-deploy --version
        echo "✅ Package build and installation validation completed"

    - name: Upload validation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-dist
        path: dist/
        retention-days: 1

  build-python-matrix:
    runs-on: ubuntu-latest
    needs: [build-validation]
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Build and test package for Python ${{ matrix.python-version }}
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        uv pip install build
        echo "🔧 Building package for Python ${{ matrix.python-version }}..."
        python -m build --wheel --sdist
        pip install dist/*.whl
        n8n-deploy --version
        echo "✅ Build successful for Python ${{ matrix.python-version }}"

    - name: Upload matrix build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: matrix-dist-${{ matrix.python-version }}
        path: dist/
        retention-days: 1

  # Build stage
  build-production:
    runs-on: ubuntu-latest
    needs: [build-validation, build-python-matrix]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies and build final package
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        uv pip install build twine
        python -m build --wheel --sdist
        twine check dist/*
        echo "🚀 Production environment build completed successfully"
        echo "All pipeline stages have passed validation for production release"

    - name: Upload production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-dist
        path: dist/
        retention-days: 7

  # Deploy to TestPyPI (on pre-release tags like v2.0.0-rc1)
  deploy-test-pypi:
    runs-on: ubuntu-latest
    needs: [build-production]
    if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha'))
    environment: test-pypi

    steps:
    - name: Download production artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-dist
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository_url: https://test.pypi.org/legacy/

  # Deploy to PyPI (on stable release tags)
  deploy-pypi:
    runs-on: ubuntu-latest
    needs: [build-production]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha')
    environment: pypi

    steps:
    - name: Download production artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
