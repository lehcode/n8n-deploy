# GitHub Actions CI/CD Pipeline for n8n-deploy
# Python CLI tool for n8n workflow management

name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, feat/*, develop ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"

jobs:
  # Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run secret detection with TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
      continue-on-error: true

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep

    - name: Install project dependencies
      run: |
        pip install -e .

    - name: Security audit of dependencies
      run: safety check --json || true

    - name: Static security analysis with Bandit
      run: bandit -r api/ -f json --exclude tests/ || true

    - name: Static security analysis with Semgrep
      run: |
        python -m semgrep --config=auto api/ --json || true

  # Quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-3.9-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.9-

    - name: Install dependencies
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        uv pip install types-requests types-click

    - name: Run type checking
      run: |
        source .venv/bin/activate
        mypy api/ --strict
        echo "✅ Type checking passed"

    - name: Check code formatting
      run: |
        source .venv/bin/activate
        black --check api/
        echo "✅ Code formatting check passed"

    - name: Generate coverage report
      run: |
        source .venv/bin/activate
        export N8N_DEPLOY_TESTING=1
        python run_tests.py --report --no-deps-check --quiet

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          htmlcov/
          coverage.xml
          test-results.xml
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # Test matrix across Python versions
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies and run tests
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        export N8N_DEPLOY_TESTING=1
        python run_tests.py --unit --no-deps-check --quiet

  # Integration tests
  test-integration:
    runs-on: ubuntu-latest
    needs: [security, quality]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies and run integration tests
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        export N8N_DEPLOY_TESTING=1
        python run_tests.py --integration --no-deps-check --quiet
        echo "✅ Integration tests passed"

  # Package build and deploy
  deploy:
    runs-on: ubuntu-latest
    needs: [security, quality, test-matrix, test-integration]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies and build package
      run: |
        uv venv --python python3 .venv
        source .venv/bin/activate
        uv pip install -e ".[test,dev]"
        uv pip install build twine
        python -m build
        twine check dist/*
        echo "✅ Package built successfully"

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  # Deploy to PyPI (on tags only)
  deploy-pypi:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi

    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
